<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서와 작문 학습지 빈칸 채점</title>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    background: #f5f7fa;
  }
  h1 {
    text-align: center;
    color: #2c3e50;
  }
  .card {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #34495e;
  }
  select, input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled {
    background: #bdc3c7;
    cursor: not-allowed;
  }
  #preview {
    max-width: 100%;
    margin-top: 10px;
    border-radius: 6px;
    display: none;
  }
  #result {
    line-height: 1.6;
    background: #f8f9fa;
    padding: 16px;
    border-radius: 8px;
    margin-top: 16px;
    display: none;
  }
  #result h1, #result h2, #result h3, #result h4 {
  margin-top: 16px;
  margin-bottom: 8px;
}
#result strong {
  color: #2b6cb0;
}
#result hr {
  border: none;
  border-top: 1px solid #ddd;
  margin: 16px 0;
}
#result ul, #result ol {
  padding-left: 20px;
}
  .loading {
    text-align: center;
    color: #7f8c8d;
    display: none;
  }
  .spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 10px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<h1>📝 독서와 작문 학습지 빈칸 채점</h1>

<div class="card">
  <label for="lessonSelect">차시 선택</label>
  <select id="lessonSelect">
    <option value="">불러오는 중...</option>
  </select>

  <label for="imageInput">답안 사진 업로드</label>
  <input type="file" id="imageInput" accept="image/*" capture="environment">
  <img id="preview" alt="미리보기">

  <button id="submitBtn" onclick="submitAnswer()">채점하기</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>AI가 채점 중입니다...</p>
  </div>

  <div id="result"></div>
</div>

<script>
  // ⭐ 여기에 2단계에서 복사한 GAS 웹앱 URL을 붙여넣으세요
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyMDm2h8QKJZ5NJ0N1-Xpj01I3JeK9EwHw9vfCzy7sPKk6OC7waBNriuCnktEB6su_hQA/exec';

  let selectedImageBase64 = null;
  let selectedMimeType = null;

  // 페이지 로드 시 차시 목록 가져오기
  window.onload = function() {
    loadLessonList();
  };

  function loadLessonList() {
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getLessonList' })
    })
    .then(res => res.json())
    .then(data => {
      const select = document.getElementById('lessonSelect');
      select.innerHTML = '';
      if (data.success && data.lessons.length > 0) {
        data.lessons.forEach(lesson => {
          const option = document.createElement('option');
          option.value = lesson;
          option.textContent = lesson;
          select.appendChild(option);
        });
      } else {
        select.innerHTML = '<option value="">등록된 차시가 없습니다</option>';
      }
    })
    .catch(err => {
      document.getElementById('lessonSelect').innerHTML = '<option value="">불러오기 실패</option>';
      console.error(err);
    });
  }

  // 이미지 업로드 처리
  document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    selectedMimeType = file.type;

    const reader = new FileReader();
    reader.onload = function(event) {
      selectedImageBase64 = event.target.result; // data:image/...;base64,...
      const preview = document.getElementById('preview');
      preview.src = selectedImageBase64;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  // 채점 요청
  function submitAnswer() {
    const lessonName = document.getElementById('lessonSelect').value;

    if (!lessonName) {
      alert('차시를 선택해주세요.');
      return;
    }
    if (!selectedImageBase64) {
      alert('답안 사진을 업로드해주세요.');
      return;
    }

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'grade',
        lessonName: lessonName,
        imageBase64: selectedImageBase64,
        mimeType: selectedMimeType
      })
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';

      if (data.success) {
  resultDiv.innerHTML = marked.parse(data.result);
} else {
  resultDiv.textContent = '❌ 오류: ' + data.error;
}
    })
    .catch(err => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').textContent = '❌ 요청 실패: ' + err;
    });
  }
</script>

</body>
</html>
