<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>독서 근거 찾기 트레이너</title>
<style>
  :root{
    --bg:#1e1e2e;
    --panel:#262638;
    --panel2:#2d2d44;
    --border:#3d3d5c;
    --text:#e4e4f0;
    --sub:#9d9db8;
    --accent:#7c9cff;
    --accent2:#a78bfa;
    --green:#4ade80;
    --red:#f87171;
    --yellow:#fbbf24;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:14px 16px;
    background:linear-gradient(90deg,#2a2a45,#1e1e2e);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    position:sticky;
    top:0;
    z-index:100;
  }
  header h1{
    font-size:15px;
    margin:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .stats{
    display:flex;
    gap:8px;
    align-items:center;
    font-size:12px;
    flex-wrap:wrap;
  }
  .stat-box{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:5px 9px;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .stat-box b{color:var(--yellow); font-size:13px;}
  #comboDisplay{color:var(--accent2); font-weight:bold;}

  /* 모바일에서는 탭으로 지문/문제 전환 */
  .tab-bar{
    display:none;
    position:sticky;
    top:0;
    z-index:99;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .tab-btn{
    flex:1;
    padding:12px;
    text-align:center;
    background:none;
    border:none;
    color:var(--sub);
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab-btn.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  main{
    flex:1;
    display:flex;
    gap:16px;
    padding:12px;
  }
  @media (max-width:900px){
    main{
      flex-direction:column;
      padding:8px;
      gap:0;
    }
    .tab-bar{display:flex;}
    .panel{display:none;}
    .panel.mobile-active{display:flex;}
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    flex:1 1 50%;
    min-width:0;
    display:flex;
    flex-direction:column;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
  }
  .panel h2{
    margin:0 0 12px;
    font-size:13px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid var(--border);
    padding-bottom:10px;
  }
  #passageBox{
    overflow-y:auto;
    max-height:60vh;
    font-size:16px;
    line-height:2.1;
    user-select:text;
    -webkit-user-select:text;
    -webkit-touch-callout:default;
    padding-right:4px;
    word-break:keep-all;
  }
  @media (max-width:900px){
    #passageBox{max-height:calc(100vh - 260px);}
    #qArea{max-height:calc(100vh - 260px) !important;}
  }
  .line{
    display:flex;
    gap:8px;
    padding:3px 4px;
    border-radius:6px;
  }
  .lineno{
    color:#565676;
    font-size:11px;
    width:20px;
    text-align:right;
    flex-shrink:0;
    user-select:none;
    padding-top:4px;
  }
  .linetext{flex:1;}
  .linetext span{
    -webkit-user-select:text;
    user-select:text;
  }
  mark.ev-picked{
    background:rgba(124,156,255,0.35);
    color:#fff;
    border-radius:3px;
    padding:0 1px;
  }
  mark.ev-correct{
    background:rgba(74,222,128,0.4);
    color:#fff;
    border-radius:3px;
    padding:0 1px;
    box-shadow:0 0 6px rgba(74,222,128,0.5);
  }
  mark.ev-wrong{
    background:rgba(248,113,113,0.35);
    color:#fff;
    border-radius:3px;
    padding:0 1px;
  }
  #selPreview{
    margin-top:10px;
    font-size:12.5px;
    color:var(--sub);
    background:var(--panel2);
    border:1px dashed var(--border);
    border-radius:8px;
    padding:10px 12px;
    min-height:20px;
    word-break:break-word;
    line-height:1.6;
  }
  #selPreview b{color:var(--accent);}
  #qArea{overflow-y:auto; max-height:60vh; padding-right:4px;}
  .q-block{
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px dashed var(--border);
  }
  .q-block:last-child{border-bottom:none;}
  .question-header{
    background:linear-gradient(135deg, rgba(124,156,255,0.18), rgba(167,139,250,0.12));
    border:1px solid var(--accent);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
    margin-top: 4px;
  }
  .question-header .q-index-badge{
    display:inline-block;
    background:var(--accent);
    color:#0d0d16;
    font-size:11px;
    font-weight:bold;
    padding:2px 8px;
    border-radius:20px;
    margin-bottom:6px;
  }
  .question-header .q-main-text{
    font-size:15.5px;
    font-weight:bold;
    color:#ffffff;
    line-height:1.4;
  }
  .choice-card{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    transition:box-shadow .2s;
    position:relative;
    overflow:hidden;
  }
  .choice-card.correct-flash{ animation:flashGreen .8s ease; }
  .choice-card.wrong-flash{ animation:flashRed .8s ease; }
  @keyframes flashGreen{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,0.7);}
    100%{box-shadow:0 0 0 12px rgba(74,222,128,0);}
  }
  @keyframes flashRed{
    0%{box-shadow:0 0 0 0 rgba(248,113,113,0.7);}
    100%{box-shadow:0 0 0 12px rgba(248,113,113,0);}
  }
  .choice-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .choice-num{
    display:inline-block;
    background:var(--accent);
    color:#0d0d16;
    font-weight:bold;
    border-radius:50%;
    width:22px;height:22px;
    text-align:center;
    line-height:22px;
    font-size:12px;
    flex-shrink:0;
  }
  .choice-text{
    flex:1;
    font-size:14.5px;
    line-height:1.5;
  }
  .ox-toggle{
    display:flex;
    gap:6px;
    margin:10px 0;
  }
  .ox-btn{
    flex:1;
    padding:11px 0;
    border-radius:8px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--sub);
    cursor:pointer;
    font-weight:bold;
    transition:.15s;
    font-size:14px;
  }
  .ox-btn.o-btn.active{
    background:rgba(74,222,128,0.2);
    border-color:var(--green);
    color:var(--green);
  }
  .ox-btn.x-btn.active{
    background:rgba(248,113,113,0.2);
    border-color:var(--red);
    color:var(--red);
  }
  .card-controls{
    display:flex;
    gap:8px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .mini-btn{
    font-size:13px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
    flex:1;
    min-width:120px;
  }
  .mini-btn.add-btn{
    border-color:var(--accent);
    color:var(--accent);
    font-weight:bold;
  }
  .evidence-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .evidence-item{
    font-size:12px;
    background:rgba(124,156,255,0.08);
    border:1px solid rgba(124,156,255,0.3);
    border-radius:8px;
    padding:8px 8px 8px 10px;
    color:#cfd6ff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .evidence-item .ev-text{flex:1; word-break:break-word;}
  .evidence-item .ev-remove{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--red);
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    padding:4px 8px;
    border-radius:6px;
  }
  .evidence-count-hint{
    font-size:11px;
    color:var(--sub);
    margin-top:4px;
  }
  .result-icon{
    font-size:12.5px;
    font-weight:bold;
    margin-top:8px;
    display:none;
    border-radius:8px;
    padding:8px 10px;
    line-height:1.6;
  }
  .result-icon.show{display:block;}
  .result-icon.ok{background:rgba(74,222,128,0.15); color:var(--green);}
  .result-icon.bad{background:rgba(248,113,113,0.15); color:var(--red);}
  .result-icon.partial{background:rgba(251,191,36,0.15); color:var(--yellow);}
  .footer-actions{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    position:sticky;
    bottom:0;
    background:var(--panel);
    padding-top:10px;
  }
  .main-btn{
    flex:1;
    padding:15px;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }
  #gradeBtn{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#10101c;
  }
  #gradeBtn:disabled{opacity:0.5;}
  #resetBtn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--sub);
  }
  #scoreSummary{
    margin-top:14px;
    padding:14px;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    display:none;
  }
  #scoreSummary.show{display:block;}
  #scoreSummary h3{margin:0 0 8px; font-size:15px; color:#fff;}
  #sendStatus{
    font-size:12px;
    margin-top:8px;
    padding:8px 10px;
    border-radius:8px;
  }
  #sendStatus.sending{background:rgba(251,191,36,0.15); color:var(--yellow);}
  #sendStatus.sent{background:rgba(74,222,128,0.15); color:var(--green);}
  #sendStatus.error{background:rgba(248,113,113,0.15); color:var(--red);}
  .pop-score{
    position:fixed;
    font-weight:bold;
    font-size:20px;
    color:var(--yellow);
    pointer-events:none;
    z-index:999;
    animation:popUp 1s ease forwards;
  }
  @keyframes popUp{
    0%{opacity:1; transform:translateY(0) scale(1);}
    100%{opacity:0; transform:translateY(-60px) scale(1.3);}
  }
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  #nameModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
  }
  #nameModal .modal-box{
    background:var(--panel);
    border:1px solid var(--border);
    padding:28px 22px;
    border-radius:16px;
    width:100%;
    max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  #nameModal h3{ margin:0 0 6px; color:#fff; font-size:18px; }
  #nameModal p{ margin:0 0 16px; color:var(--sub); font-size:13px; line-height:1.5; }
  #studentNameInput{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:#fff;
    margin-bottom:14px;
    font-size:15px;
  }
  #startBtn{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;
    border-radius:10px;
    color:#10101c;
    font-weight:bold;
    font-size:15px;
  }

  /* 도움말 배너 */
  .help-banner{
    background:rgba(124,156,255,0.1);
    border:1px solid rgba(124,156,255,0.3);
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    color:#b8c4ff;
    margin-bottom:10px;
    line-height:1.5;
  }
</style>
</head>
<body>

<div id="nameModal">
  <div class="modal-box">
    <h3>📖 독서 근거 찾기 트레이너</h3>
    <p>이름(또는 반+번호+이름)을 입력한 뒤 시작해주세요.<br>결과가 선생님께 자동으로 전송됩니다.</p>
    <input id="studentNameInput" type="text" placeholder="예: 3-2 홍길동" autocomplete="off">
    <button id="startBtn">시작하기</button>
  </div>
</div>

<div class="app">
  <header>
    <h1>📖 근거 찾기 트레이너</h1>
    <div class="stats">
      <div class="stat-box">⏱ <b id="timerDisplay">00:00</b></div>
      <div class="stat-box">🔥 <span id="comboDisplay">0</span></div>
      <div class="stat-box">🏆 <b id="scoreDisplay">0</b></div>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabPassage">📄 지문 보기</button>
    <button class="tab-btn" id="tabQuestion">✅ 문제 풀기</button>
  </div>

  <main>
    <section class="panel mobile-active" id="passagePanel">
      <h2>📄 지문 (문장을 손가락으로 길게 눌러 선택)</h2>
      <div class="help-banner">
        💡 <b>모바일 사용법</b><br>
        1) 문장을 <b>손가락으로 꾹 누르세요</b> (길게 터치)<br>
        2) 파란색 핸들이 나오면 <b>드래그</b>해서 범위를 조절하세요<br>
        3) 아래에 선택 문장이 나타나면, <b>하단 탭에서 "문제 풀기"</b>로 이동해 해당 선지의 [📍 근거 추가] 버튼을 누르세요
      </div>
      <div id="passageBox"></div>
      <div id="selPreview">지문에서 문장을 선택하면 여기에 표시됩니다.</div>
    </section>

    <section class="panel" id="questionPanel">
      <h2>✅ 선지 판단</h2>
      <div id="qArea"></div>
      <div class="footer-actions">
        <button class="main-btn" id="gradeBtn">채점하기</button>
        <button class="main-btn" id="resetBtn">🔄 재시도</button>
      </div>
      <div id="scoreSummary"></div>
    </section>
  </main>
</div>

<script>
/* ⚠️⚠️⚠️ 아래 줄의 따옴표 안에 본인의 구글 앱스스크립트 웹앱 URL을 붙여넣으세요 ⚠️⚠️⚠️ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwEjBnMgDdORG3NYur4qS0322ZMt0IV7FF9uGVAUjnhYvJGiDbc_jt91K72xuvKx9IO/exec";

/* ===================== 문제 데이터 ===================== */
const DATA = {
  passage: "CISG에 따르면 위험은 매매 계약이 체결된 시점부터 계약 내용의 이행이 완료된 시점에 이르는 동안 매도인에서 매수인으로 이전된다. 위험 이전은 매매 계약의 이행 과정에서 위험을 부담하는 주체가 변경되는 것을 의미한다. 위험이 매수인에게 이전되기 전에 양 당사자의 책임이 없는 사유로 물품이 멸실 또는 훼손되어 계약의 이행이 불가능하게 되었다면, 매도인이 여전히 물품을 공급할 부담을 지게 된다. 위험이 매수인에게 이전된 후에는 그 위험 부담을 매수인이 지게 되어 물품 대금을 지급할 의무가 있다. CISG의 위험 이전 규정이 적용되기 위해서는 국제 거래에서 매매 계약에 대해 당사자 간에 별도의 합의나 관행이 없고 매매 계약의 물품이 특정되어야 한다. ㉠매매 계약의 유형에 따른 위험 이전에 대한 CISG의 내용은 다음과 같다. 매매 계약에 물품의 운송이 포함되어 있고 매도인이 물품을 운송인에게 특정한 장소에서 인도할 의무가 없는 경우, 위험은 물품이 매도인으로부터 최초의 운송인에게 인도된 시점에 매수인에게 이전된다. 이와 같이 위험 이전 시점을 정하는 이유는 운송의 결과에 따른 손해 배상과 보험금의 지급 청구 및 수령에 매수인이 매도인보다 용이하기 때문이다. 매매 계약에 물품의 운송이 포함되어 있고 매도인이 물품을 운송인에게 특정한 장소에서 인도할 의무가 있는 경우, 위험은 물품이 운송인에게 특정한 장소에서 인도되는 시점에 매수인에게 이전된다. 국제 거래에서는 매매 계약에 물품의 운송이 포함되어 있는 경우가 대부분이지만, 운송이 포함되어 있지 않은 경우도 있다. 예를 들어 매매 계약에 운송이 포함되어 있지 않고 매도인의 영업소에서 매수인이 물품을 수령해야 하는 경우에는, 매수인이 매도인의 영업소에서 물품을 수령했을 때 매수인에게 위험이 이전된다. 한편 원유, 천연가스와 같은 물품은 운송 중에 매매 계약이 빈번하게 이루어진다. 이 경우에는 물품에 관한 위험이 계약 체결 시에 매수인에게 이전된다. 위험 이전 시점은 물품 부적합에 대한 책임을 판단하는 기준이 될 수 있다. 물품 부적합이란 물품이 계약 내용이나 법적 안전 기준에 맞지 않는 상태를 의미한다. CISG에 따르면 물품 부적합이 위험 이전 시점 전에 존재했다면, 매도인이 그 책임을 지도록 하기 위해 매수인은 수령한 물품이 품질, 포장 등에서 계약에 합치하는지 확인할 의무가 있다.",
  questions: [
    {
      id: 1,
      questionText: "윗글과 관련하여 ㉠을 이해한 내용으로 가장 적절한 것은?",
      choices: [
        {
          num:1,
          text:"물품의 운송이 포함되어 있는 매매 계약의 경우 운송인이 위험 이전 시점을 결정할 수 있다.",
